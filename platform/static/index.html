<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copperleaf Ops Console</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <nav class="sidebar">
      <div class="brand">
        <div class="mark">Copperleaf</div>
        <div class="sub">Ops Console</div>
      </div>

      <div class="nav-item" data-view="chat">Chat with agents</div>
      <div class="nav-item" data-view="runs">State-graph runs</div>
      <div class="nav-item" data-view="hitl">HITL queue <span class="count" id="count-hitl">0</span></div>
      <div class="nav-item" data-view="tickets">Failure tickets <span class="count" id="count-tickets">0</span></div>
      <div class="nav-item" data-view="agents">Agents &amp; tools</div>
      <div class="nav-item" data-view="rag">RAG documents</div>

      <div class="sidebar-footer">
        Backend: <span id="backend-status">checking…</span>
      </div>
    </nav>

    <main id="main">
      <!-- rendered by app.js -->
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
